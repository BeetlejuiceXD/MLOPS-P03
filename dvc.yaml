stages:
  quality_report:
    wdir: app
    cmd: uv run python dvc_quality_report_stage.py
    deps:
      - ../data/raw/annotations
      - ../data/raw/images
      - dvc_quality_report_stage.py
      - ingestion
      - analyzers
      - policies
      - presentation/contracts.py
      - presentation/gate.py
      - storage/settings.py
      - splits/__init__.py
      - splits/models.py
      - splits/stratified.py
    params:
      - splits/splits.yaml:
          - train
          - val
          - test
          - seed
    metrics:
      - ../reports/quality.json:
          cache: false

  quality_gate:
    wdir: app
    cmd: uv run python dvc_gate_stage.py
    deps:
      - ../reports/quality.json
      - dvc_gate_stage.py
      - presentation/contracts.py
    outs:
      - ../reports/.quality_gate.passed:
          cache: false

  split:
    wdir: app
    cmd: uv run python dvc_split_stage.py
    deps:
      - ../data/raw/annotations
      - ../data/raw/images
      - ../reports/.quality_gate.passed
      - dvc_split_stage.py
      - dvc_gate_stage.py
      - ingestion
      - analyzers
      - policies
      - presentation/contracts.py
      - presentation/gate.py
      - presentation/splits.py
      - storage/settings.py
      - splits
    outs:
      - ../reports/splits.json:
          cache: false

  projections:
    wdir: app
    cmd: uv run python dvc_projections_stage.py
    deps:
      - ../data/raw/annotations
      - ../data/raw/images
      - dvc_projections_stage.py
      - projections/__init__.py
      - projections/compute.py
      - projections/models.py
      - ingestion/__init__.py
      - ingestion/loader.py
      - ingestion/models.py
      - presentation/__init__.py
      - presentation/contracts.py
      - presentation/projections.py
      - presentation/projections_contracts.py
      - analyzers/base.py
      - storage/settings.py
      - policies/models.py
      - policies/quality.yaml
      - pyproject.toml
      - uv.lock
    params:
      - projections/projections.yaml:
          - dataset_version
          - features
          - pca
          - tsne
    outs:
      - ../reports/projections.json:
          cache: false

  manifest_p3:
    wdir: app
    cmd: uv run python dvc_manifest_p3_stage.py
    deps:
      # Cierre real de imports de la etapa (archivos, no carpetas: una carpeta
      # arrastraría __pycache__ al md5 y dvc status cambiaría en cada clon).
      - ../data/raw/annotations
      - ../data/raw/images
      - ../reports/versions.json
      - ../reports/releases
      - dvc_manifest_p3_stage.py
      - analyzers/__init__.py
      - analyzers/base.py
      - analyzers/cross_split_leakage.py
      - analyzers/duplicates.py
      - analyzers/imbalance.py
      - analyzers/invalid_boxes.py
      - analyzers/small_objects.py
      - analyzers/spatial_bias.py
      - crops/__init__.py
      - crops/engine.py
      - crops/models.py
      - ingestion/__init__.py
      - ingestion/loader.py
      - ingestion/models.py
      - ingestion/release_sources.yaml
      - manifest/__init__.py
      - manifest/generator.py
      - manifest/models.py
      - policies/__init__.py
      - policies/duplicates.py
      - policies/models.py
      - policies/quality.yaml
      - presentation/__init__.py
      - presentation/contracts.py
      - presentation/crops_report.py
      - presentation/gate.py
      - presentation/manifest_candidate.py
      - presentation/manifest_freeze.py
      - presentation/release.py
      - presentation/release_resolver.py
      - presentation/splits.py
      - splits/__init__.py
      - splits/models.py
      - splits/stratified.py
      - storage/__init__.py
      - storage/settings.py
      - pyproject.toml
      - uv.lock
    params:
      - manifest/manifest.yaml:
          - train
          - val
          - test
          - seed
    outs:
      - ../data/manifest_p3/train_val.json
      - ../data/manifest_p3/test.json
      - ../reports/manifest_p3.json:
          cache: false
      - ../reports/manifest_p3_freeze.json:
          cache: false

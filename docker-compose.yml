# Variables que exige `storage.settings.Settings` (las usan `app` y `copilot`).
x-pipeline-env: &pipeline-env
  DATABASE_URL: "mysql+pymysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
  MINIO_BUCKET: image-annotations
  DATASET_DIR: /app/data/raw
  REPORTS_DIR: /app/reports
  # D02-01: tracking P3 dentro de Compose (el host usa http://localhost:5000).
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # Artefactos siempre a través del servidor MLflow, nunca con URL prefirmada a MinIO.
  MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
  MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: image_repo
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO retiró sus imágenes de Docker Hub (sep 2026) y quay.io/minio/minio ya no
    # se descarga sin login, ni con tag fijo. Se usa la build gratuita de Chainguard
    # del mismo binario, fijada por digest. Solo para uso local/CI.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # La imagen corre como no-root; la anterior corría como root y los volúmenes
    # minio_data existentes son de root: se mantiene root para poder escribirlos.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # La imagen trae bash pero no curl/wget: sonda HTTP con /dev/tcp de bash.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # D02-01: MLflow persistente. Backend store = base `mlflow` en el MariaDB del
  # portal; artefactos (runs y checkpoints) = bucket `mlflow-artifacts` en MinIO,
  # servidos por el propio MLflow. Ambos viven en los volúmenes nombrados de abajo,
  # así que sobreviven a `docker compose restart` y a `down` (sin `-v`).
  mlflow:
    build: ./infra/mlflow
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_DB_HOST: mariadb
      MLFLOW_DB_PORT: 3306
      MLFLOW_DB_USER: root
      MLFLOW_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MLFLOW_DB_NAME: mlflow
      MLFLOW_ARTIFACTS_BUCKET: mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Credenciales de MinIO local (no de AWS): el SDK de S3 las lee con estos nombres.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      AWS_DEFAULT_REGION: us-east-1
      # boto3 reciente calcula/valida checksums por defecto; con S3 compatibles como
      # MinIO se limita a cuando la API lo exige.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      # En macOS el 5000 lo ocupa AirPlay Receiver: usa MLFLOW_HOST_PORT=5001 en .env.
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    restart: on-failure:5

  backend:
    build: ./backend
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: "mysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      DB_NAME: image_repo
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: image-annotations
      MAX_UPLOAD_SIZE_BYTES: 5242880
      PIPELINE_CONFIG_ROOT: /pipeline
    volumes:
      - ./app/policies:/pipeline/policies
      - ./app/splits:/pipeline/splits
    ports:
      - "3100:3100"
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
      - copilot
    ports:
      - "8080:80"
    volumes:
      # P2-22/23/24: el gate (servicio `app`) escribe reportes acá; nginx
      # los sirve como estático en /reports/*.json, sin backend HTTP nuevo.
      - ./reports:/usr/share/nginx/html/reports:ro

  app:
    build: ./app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment: *pipeline-env
    volumes:
      # Dataset real (anotaciones + imágenes), de solo lectura: el gate no
      # escribe ahí, solo lee. El pipeline Python nunca gestionó data/raw/
      # como parte de su propia imagen (ver app/Dockerfile).
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports
      - ./app/policies:/app/policies:ro
      - ./app/splits:/app/splits:ro
    restart: on-failure:5

  # D02-05: ejecuta los jobs de entrenamiento fuera del request HTTP. Hace polling de
  # training_jobs en MariaDB (tablas de la migración del backend; espera a que existan),
  # registra runs en MLflow y persiste progreso, logs y errores. Un job interrumpido
  # (SIGTERM o worker caído) termina como failed con motivo; nunca se reejecuta solo.
  trainer-worker:
    build: ./app
    command: ["python", "-m", "trainer_worker.main"]
    depends_on:
      mariadb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *pipeline-env
      TRAINER_POLL_SECONDS: ${TRAINER_POLL_SECONDS:-2}
      TRAINER_CONTROLLED_EPOCH_SECONDS: ${TRAINER_CONTROLLED_EPOCH_SECONDS:-0.5}
      TRAINER_STALE_AFTER_SECONDS: ${TRAINER_STALE_AFTER_SECONDS:-60}
      # Con MLflow caído, cada intento falla rápido y el cierre queda pendiente para la
      # siguiente vuelta, en vez de bloquear el worker minutos en reintentos HTTP.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    stop_grace_period: 20s
    restart: on-failure:5

  # P2-52: agente del Copilot (LLM + herramientas MCP de solo lectura). Misma
  # imagen que `app`, otro comando. No se publica ningún puerto: solo nginx
  # (servicio `frontend`) lo alcanza, en /copilot-api/. Sin ANTHROPIC_API_KEY
  # arranca igual y el chat responde 503 explicando qué falta.
  copilot:
    build: ./app
    command: ["python", "-m", "copilot.server"]
    environment:
      <<: *pipeline-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-opus-5}
      COPILOT_HOST: 0.0.0.0
    volumes:
      # Solo lectura: el Copilot consulta el dataset y los reportes, nunca escribe.
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports:ro
    restart: on-failure:5

volumes:
  mariadb_data:
  minio_data:
